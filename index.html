<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9E3EE">
<title>Domis Angie Acuña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root {
  --fur-top: #A9E3EE;
  --fur-mid: #D9F3F7;
  --fur-low: #EAF9FB;
  --surface: #F4FCFE;
  --surface-done: #D9C8F3;
  --ink: #2B1B4A;
  --muted: #5D4C86;
  --line: #8FD3E0;
  --teal: #1F8FA5;
  --spot: #7C4DB5;
  --spot-deep: #4B2A85;
  --pink: #B8326F;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--fur-mid); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(90% 45% at 100% 100%, rgba(124, 77, 181, .20), transparent 65%),
    linear-gradient(180deg, var(--fur-top) 0%, var(--fur-mid) 45%, var(--fur-low) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 480px; margin: 0 auto; padding: 22px 16px 36px; }

header { position: relative; padding: 2px 4px 20px; text-align: center; }
header > * { position: relative; z-index: 1; }
header::before, header::after {
  content: '';
  position: absolute;
  z-index: 0;
  border-radius: 50%;
  background: var(--spot);
  opacity: .22;
  pointer-events: none;
}
header::before { left: 2px; top: 8px; width: 46px; height: 46px; box-shadow: 30px 58px 0 -15px var(--spot); }
header::after { right: 6px; top: 40px; width: 36px; height: 36px; box-shadow: -34px -34px 0 -12px var(--spot); }

.brand {
  margin: 0;
  font-family: 'Pacifico', 'Brush Script MT', cursive;
  font-weight: 400;
  font-size: clamp(54px, 18vw, 76px);
  line-height: 1.1;
  color: var(--spot);
  text-shadow: 0 3px 0 #F5E6C4, 0 6px 14px rgba(75, 42, 133, .25);
}
.owner { margin: 0; font-weight: 600; font-size: 22px; letter-spacing: .02em; color: var(--ink); }
.day { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.count { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 14px; }
.count .n {
  font-weight: 700;
  font-size: clamp(92px, 30vw, 132px);
  line-height: .95;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.count .of { font-weight: 500; font-size: 28px; color: var(--teal); }
.money {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  margin: 12px 0 0;
  padding: 8px 18px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 999px;
}
.money .lbl { font-size: 15px; color: var(--muted); }
.money strong { font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--teal); font-variant-numeric: tabular-nums; }
.money .max { font-size: 14px; color: var(--muted); }
.toast {
  position: fixed;
  z-index: 9;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 50%;
  width: max-content;
  max-width: calc(100% - 32px);
  transform: translateX(-50%);
  padding: 12px 20px;
  text-align: center;
  font-weight: 600;
  font-size: 18px;
  line-height: 1.3;
  color: #fff;
  background: var(--spot-deep);
  border: 2px solid var(--spot);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(43, 27, 74, .4);
  pointer-events: none;
}
.toast.in { animation: toast-in .3s cubic-bezier(.2, 1.3, .4, 1) both; }
.toast.out { animation: toast-out .25s ease-in both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -16px) scale(.92); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast.in, .toast.out { animation: none; } }
.status { margin: 10px 0 0; font-weight: 500; font-size: 18px; color: var(--ink); }
.all-done .n, .all-done .status { color: var(--teal); }
.all-done .status { font-weight: 600; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  aspect-ratio: 3 / 2;
  padding: 14px 14px 12px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 22px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .08s ease-out, border-color .15s, box-shadow .15s;
}
.tile::after {
  content: '';
  position: absolute;
  right: -12px;
  top: -12px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--spot);
  opacity: .16;
  pointer-events: none;
}
.tile:active:not(:disabled) {
  transform: scale(.97);
  border-color: var(--spot);
  box-shadow: 0 0 0 3px rgba(124, 77, 181, .25);
}
.tile:focus-visible, .btn:focus-visible { outline: 3px solid var(--spot); outline-offset: 3px; }
.tile .num { font-weight: 700; font-size: 46px; line-height: 1; }
.tile .meta { font-size: 14px; color: var(--muted); }
.tile.done {
  background: var(--surface-done);
  border-color: transparent;
  cursor: default;
}
.tile.done::after { opacity: .0; }
.tile.done .num { color: var(--muted); }
.tile.done .meta { color: var(--spot-deep); font-weight: 600; }
.sticker {
  position: absolute;
  right: 8px;
  top: 50%;
  width: 74px;
  height: 74px;
  margin-top: -37px;
  transform: rotate(-8deg);
  filter: drop-shadow(0 3px 4px rgba(75, 42, 133, .3));
  pointer-events: none;
  z-index: 1;
}
.tile.fresh .sticker { animation: sticker-pop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes sticker-pop {
  0% { transform: rotate(-200deg) scale(0); opacity: 0; }
  100% { transform: rotate(-8deg) scale(1); opacity: 1; }
}
.sticker .sp { transform-box: fill-box; transform-origin: center; }
.tile.fresh .sticker .sp { animation: twinkle .8s ease-out both; }
.tile.fresh .sticker .sp:nth-of-type(2) { animation-delay: .1s; }
.tile.fresh .sticker .sp:nth-of-type(3) { animation-delay: .2s; }
.tile.fresh .sticker .sp:nth-of-type(4) { animation-delay: .3s; }
@keyframes twinkle {
  0% { opacity: 0; transform: scale(0) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.5) rotate(45deg); }
  100% { opacity: 1; transform: scale(1) rotate(90deg); }
}
@media (prefers-reduced-motion: reduce) {
  .tile.fresh .sticker, .tile.fresh .sticker .sp { animation: none; }
  .tile { transition: none; }
}

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.btn {
  min-height: 50px;
  padding: 10px 12px;
  font: inherit;
  font-weight: 600;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  touch-action: manipulation;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--pink); }
.btn.primary { background: var(--spot); border-color: var(--spot); color: #fff; }

.confirm {
  margin-top: 14px;
  padding: 14px;
  background: var(--surface);
  border: 2px solid var(--spot);
  border-radius: 18px;
}
.confirm p { margin: 0 0 12px; font-weight: 600; }
.confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.note {
  margin: 16px 4px 0;
  padding: 12px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  font-size: 15px;
  color: var(--muted);
}
.note button {
  display: inline;
  margin-top: 8px;
  padding: 0;
  font: inherit;
  font-weight: 600;
  color: var(--spot);
  background: none;
  border: 0;
  text-decoration: underline;
  cursor: pointer;
}
.note.warn { border-color: var(--pink); color: var(--ink); }
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(43, 27, 74, .6);
}
.cele-card {
  width: 100%;
  max-width: 340px;
  padding: 22px 20px 20px;
  text-align: center;
  background: var(--surface);
  border: 3px solid var(--spot);
  border-radius: 28px;
  box-shadow: 0 18px 50px rgba(43, 27, 74, .45);
  animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both;
}
.cele-face { width: 170px; height: 170px; margin: 0 auto 6px; }
.cele-face svg, .cele-face img { display: block; width: 100%; height: 100%; object-fit: contain; }
.cele-title {
  margin: 0;
  font-family: 'Pacifico', 'Brush Script MT', cursive;
  font-weight: 400;
  font-size: 34px;
  line-height: 1.15;
  color: var(--spot);
}
.cele-sub { margin: 8px 0 18px; font-weight: 500; font-size: 18px; color: var(--ink); }
.cele-total { display: block; margin-top: 4px; font-size: 32px; font-weight: 700; color: var(--teal); }
.cele-card .btn { width: 100%; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cele-card { animation: none; } }
.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 18px;
}
.stepper .lbl { font-weight: 600; font-size: 17px; line-height: 1.2; }
.stepper .hint { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.stepper .ctrl { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.stepper .num { min-width: 2ch; text-align: center; font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.round {
  width: 48px;
  height: 48px;
  padding: 0;
  font: inherit;
  font-size: 28px;
  line-height: 1;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  touch-action: manipulation;
}
.round:focus-visible { outline: 3px solid var(--spot); outline-offset: 3px; }
.round:disabled { opacity: .4; cursor: default; }
.round.add { background: var(--spot); border-color: var(--spot); color: #fff; }
.stepper + .actions { margin-top: 12px; }
.love {
  margin: 30px 0 0;
  text-align: center;
  font-family: 'Pacifico', 'Brush Script MT', cursive;
  font-size: 26px;
  line-height: 1.5;
  color: var(--spot);
}
.love .e { font-family: system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: 32px; vertical-align: middle; }
.bday-line {
  display: inline-block;
  margin: 0 0 8px;
  padding: 7px 16px;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  color: #fff;
  background: linear-gradient(90deg, var(--spot), #D14E96);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  touch-action: manipulation;
}
.bday-line:focus-visible { outline: 3px solid var(--spot); outline-offset: 3px; }
.bday-bg .cele-card { position: relative; z-index: 1; max-height: 100%; overflow-y: auto; }
.bday-photo {
  width: 150px;
  margin: 0 auto 12px;
  padding: 5px;
  background: #fff;
  border: 3px solid var(--spot);
  border-radius: 18px;
  box-shadow: 0 6px 16px rgba(75, 42, 133, .3);
  transform: rotate(-3deg);
}
.bday-photo img { display: block; width: 100%; height: auto; border-radius: 12px; }
.bday-love {
  display: block;
  margin-top: 8px;
  font-family: 'Pacifico', 'Brush Script MT', cursive;
  font-weight: 400;
  font-size: 28px;
  line-height: 1.3;
  color: var(--spot);
}
.bday-love .e { font-family: system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: 30px; vertical-align: middle; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i {
  position: absolute;
  top: -24px;
  width: 10px;
  height: 16px;
  border-radius: 2px;
  animation: confetti-fall linear infinite;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(calc(100dvh + 40px)) rotate(600deg); }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.sound-btn {
  position: absolute;
  z-index: 3;
  top: 0;
  right: 0;
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 22px;
  line-height: 1;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  touch-action: manipulation;
}
.sound-btn:focus-visible { outline: 3px solid var(--spot); outline-offset: 3px; }
.coin-layer { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
.coin {
  position: absolute;
  left: 0;
  top: 0;
  width: 26px;
  height: 26px;
  margin: -13px 0 0 -13px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  line-height: 1;
  color: #8A5A00;
  background: radial-gradient(circle at 35% 30%, #FFF1A8, #F5C842 55%, #D99A12);
  border: 2px solid #B87A0A;
  border-radius: 50%;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
  will-change: transform, opacity;
}
.coin-plus {
  position: absolute;
  left: 0;
  top: 0;
  font-weight: 700;
  font-size: 22px;
  color: var(--teal);
  text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 1px 0 #fff;
  white-space: nowrap;
  will-change: transform, opacity;
}
.coin-chip {
  position: absolute;
  left: 50%;
  top: calc(76px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  padding: 8px 18px;
  font-weight: 700;
  font-size: 22px;
  color: var(--teal);
  background: var(--surface);
  border: 2px solid #F5C842;
  border-radius: 999px;
  box-shadow: 0 8px 22px rgba(43, 27, 74, .25);
  animation: chip-in .25s ease-out both;
}
@keyframes chip-in { from { opacity: 0; transform: translate(-50%, -10px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
.money.bump, .coin-chip.bump { animation: money-bump .45s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes money-bump {
  0% { transform: scale(1); }
  35% { transform: scale(1.14); box-shadow: 0 0 0 6px rgba(245, 200, 66, .5); }
  100% { transform: scale(1); }
}
.coin-chip.bump { animation-name: chip-bump; }
@keyframes chip-bump {
  0% { transform: translateX(-50%) scale(1); }
  35% { transform: translateX(-50%) scale(1.14); box-shadow: 0 0 0 6px rgba(245, 200, 66, .5); }
  100% { transform: translateX(-50%) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .money.bump, .coin-chip, .coin-chip.bump { animation: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app">
  <header id="head"></header>
  <div class="grid" id="grid"></div>
  <div class="stepper">
    <div class="lbl">Casillas<span class="hint">Las ya tachadas no se quitan</span></div>
    <div class="ctrl">
      <button class="round" id="less" type="button" aria-label="Quitar una casilla">&minus;</button>
      <span class="num" id="slots" aria-live="polite">12</span>
      <button class="round add" id="more" type="button" aria-label="Agregar una casilla">+</button>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="undo" type="button">Deshacer el último</button>
    <button class="btn danger" id="reset" type="button">Empezar de nuevo</button>
  </div>
  <div id="confirm" aria-live="polite"></div>
  <div id="notes" aria-live="polite"></div>
  <p class="love"><span class="e" aria-hidden="true">🐼</span> Te amo mi oso <span class="e" aria-hidden="true">🦥</span></p>
  <div id="cele"></div>
  <div id="bday"></div>
  <div id="welcome"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="coins" class="coin-layer" aria-hidden="true"></div>
</main>

<script>
(function () {
  var DEFAULT_N = 12, MIN_N = 1, MAX_N = 30;
  var N = DEFAULT_N; // se actualiza con las casillas que ella tenga
  var PRICE = 7000; // valor de cada domi

  function money(n) { return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  var KEY = 'domicilios-tachador-v1';
  var storageOk = true;
  var state = load();
  N = state.ticks.length;
  var fresh = -1;
  var pending = null; // 'undo' | 'reset' | null
  var celebrate = false;
  var lastCheer = '';
  var toastTimer = null;

  // Mensajes de ánimo que salen al tachar un domi mientras aún faltan.
  var CHEERS = [
    '¡Vas muy bien, Angie! 💪',
    '¡Uno menos! Tú puedes con todos 💜',
    'Paso a paso se llega lejos ✨',
    '¡Qué berraca eres, Angie! 💪',
    'Cada domi cuenta, sigue así 💜',
    '¡Eres imparable! 🚀',
    'Toma agüita y sigue, vas increíble 💧',
    '¡Tu esfuerzo se nota, Angie! 🌟',
    '¡Así se hace, campeona! 🏆',
    'Orgulloso de ti, sigue brillando ✨'
  ];

  function specialCheer(c) {
    var left = N - c;
    if (left === 1) return '¡Solo falta uno! Último esfuerzo, Angie 🔥';
    if (c === Math.ceil(N / 2)) return '¡Ya vas por la mitad! 🎉';
    if (c === 1) return '¡Y arrancamos! Primer domi hecho 🚀';
    return '';
  }

  function pickCheer() {
    var pool = CHEERS.filter(function (m) { return m !== lastCheer; });
    var m = pool[Math.floor(Math.random() * pool.length)];
    lastCheer = m;
    return m;
  }

  function showToast(text) {
    var el = document.getElementById('toast');
    clearTimeout(toastTimer);
    el.textContent = text;
    el.hidden = false;
    el.className = 'toast';
    void el.offsetWidth; // reinicia la animación si ya había un aviso
    el.className = 'toast in';
    toastTimer = setTimeout(function () {
      el.className = 'toast out';
      toastTimer = setTimeout(function () { el.hidden = true; }, 260);
    }, 3200);
  }

  function hideToast() {
    var el = document.getElementById('toast');
    clearTimeout(toastTimer);
    el.hidden = true;
    el.className = 'toast';
  }

  // Monstruito original (turquesa con manchas moradas). Si en el repo existe cara.png, se usa esa imagen en su lugar.
  var FACE_SVG =
    '<svg viewBox="0 0 200 200" role="img" aria-label="Monstruito feliz" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M64 60 Q52 30 38 22 Q68 20 84 52 Z" fill="#F5E6C4" stroke="#CDB78A" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M136 60 Q148 30 162 22 Q132 20 116 52 Z" fill="#F5E6C4" stroke="#CDB78A" stroke-width="3" stroke-linejoin="round"/>' +
    '<ellipse cx="100" cy="112" rx="76" ry="72" fill="#7AD3E3" stroke="#1F8FA5" stroke-width="4"/>' +
    '<g fill="#7C4DB5"><circle cx="78" cy="68" r="9"/><circle cx="100" cy="58" r="8"/><circle cx="122" cy="68" r="9"/><circle cx="40" cy="112" r="9"/><circle cx="160" cy="112" r="9"/></g>' +
    '<ellipse cx="100" cy="142" rx="44" ry="30" fill="#BDEEF5"/>' +
    '<ellipse cx="76" cy="102" rx="16" ry="18" fill="#fff" stroke="#2B1B4A" stroke-width="2.5"/>' +
    '<ellipse cx="124" cy="102" rx="16" ry="18" fill="#fff" stroke="#2B1B4A" stroke-width="2.5"/>' +
    '<circle cx="78" cy="104" r="8" fill="#2B1B4A"/><circle cx="122" cy="104" r="8" fill="#2B1B4A"/>' +
    '<circle cx="81" cy="101" r="2.6" fill="#fff"/><circle cx="125" cy="101" r="2.6" fill="#fff"/>' +
    '<g stroke="#2B1B4A" stroke-width="3" stroke-linecap="round" fill="none"><path d="M62 90 L53 84"/><path d="M68 85 L62 76"/><path d="M76 83 L76 73"/><path d="M138 90 L147 84"/><path d="M132 85 L138 76"/><path d="M124 83 L124 73"/></g>' +
    '<ellipse cx="100" cy="128" rx="11" ry="8" fill="#5D4C86"/>' +

  function blank() { return { v: 2, ticks: new Array(N).fill(null), day: null }; }

          // Estados guardados por versiones anteriores (sin v:2) se completan a 12; los nuevos respetan las casillas elegidas.
          if (s.v !== 2) { while (tk.length < DEFAULT_N) tk.push(null); }
          if (tk.length < MIN_N) tk = new Array(DEFAULT_N).fill(null);

  }

  }

  function longDate(d) {
    return cap(d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }));
  }

  function keyToDate(k) {
    var p = k.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  }

  function lastIndex() {

    state.ticks.forEach(function (t, i) { if (t !== null && t > best) { best = t; idx = i; } });
    return idx;

  function tick(i) {
    if (state.ticks[i] !== null) return; // las ya tachadas no se tocan
    state.ticks[i] = Date.now();
    if (!state.day) state.day = todayKey();
    fresh = i;
    pending = null;

    if (count() < N) showToast(specialCheer(count()) || pickCheer()); else hideToast();
    if (celebrate) { if (!playSong()) sfx('done'); } else sfx('tick');

    render();

    fresh = -1;
    pending = null;

    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        tone(780, 0.07, 0.12, 'sine', 0.16);
      } else if (name === 'remove') {   // quitar casilla / deshacer

  var coinBuf = null, coinLoading = false;
  var USE_CAJA = false; // true = usa el sonido de caja registradora; false = tintineo de monedas generado en el navegador

  function loadCoinBuf() {
    if (!USE_CAJA || coinBuf || coinLoading) return;
    var c = audioCtx();
    if (!c) return;
    coinLoading = true;
    try {
      var bin = atob(COIN_AUDIO.split(',')[1]);
      var u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      c.decodeAudioData(u8.buffer, function (buf) { coinBuf = buf; }, function () { coinLoading = false; });
    } catch (e) { coinLoading = false; }
  }

  function playCoin(delay, land) {
    if (!soundOn) return;
    if (!USE_CAJA) { coinSoundSynth(land); return; }
    var c = audioCtx();
    if (!c) return;
    if (!coinBuf) { loadCoinBuf(); coinSoundSynth(land); return; } // mientras carga, suena el tintineo sintético
    try {
      var src = c.createBufferSource();
      var g = c.createGain();
      src.buffer = coinBuf;
      g.gain.value = 0.8;
      src.connect(g);
      g.connect(c.destination);
      src.start(c.currentTime + delay);
    } catch (e) {}

  var songBuf = null, songLoading = false;

  function loadSongBuf() {
    if (songBuf || songLoading) return;
    var c = audioCtx();
    if (!c) return;
    songLoading = true;
    try {
      var bin = atob(SONG_AUDIO.split(',')[1]);
      var u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      c.decodeAudioData(u8.buffer, function (buf) { songBuf = buf; }, function () { songLoading = false; });
    } catch (e) { songLoading = false; }
  }

  function loadBuffers() { loadCoinBuf(); loadSongBuf(); }

  // Devuelve true si logró sonar la canción (si no, se usan las campanitas)
  function playSong() {
    if (!soundOn) return false;
    var c = audioCtx();
    if (!c) return false;
    if (!songBuf) { loadSongBuf(); return false; }
    try {
      var src = c.createBufferSource();
      var g = c.createGain();
      src.buffer = songBuf;
      g.gain.value = 0.9;
      src.connect(g);
      g.connect(c.destination);
      src.start(c.currentTime + 0.05);
      return true;
    } catch (e) { return false; }
  }

  function coinSoundSynth(times) {
    if (!soundOn) return;
    try {
      times.forEach(function (t) {
        var f = 1500 + Math.random() * 700;
        tone(f, t, 0.14, 'triangle', 0.09);
        tone(f * 1.5, t, 0.1, 'sine', 0.05);
      });
    } catch (e) {}
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function coinShower() {
    var layer = document.getElementById('coins');
    if (!layer) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var N_COINS = 6, FALL = 550, STEP = 80;
    var pill = document.querySelector('.money');
    var chip = null, tx, ty, inView = false;
    if (pill) {
      var r = pill.getBoundingClientRect();
      inView = r.top >= 0 && r.bottom <= window.innerHeight;
      tx = r.left + r.width / 2;
      ty = r.top + r.height / 2;
    }
    if (!inView) {
      // Si el valor no se ve (ella bajó en la página), las monedas caen en un cartelito arriba.
      var old = layer.querySelector('.coin-chip');
      if (old) old.remove();
      chip = document.createElement('div');
      chip.className = 'coin-chip';
      chip.textContent = '🪙 ' + money(count() * PRICE);
      layer.appendChild(chip);
      var cr = chip.getBoundingClientRect();
      tx = cr.left + cr.width / 2;
      ty = cr.top + cr.height / 2;
    }

    var land = [];
    for (var i = 0; i < N_COINS; i++) land.push((i * STEP + FALL * 0.9) / 1000);
    playCoin(Math.max(0, land[0] - 0.07), land);

    if (reduce) {
      setTimeout(function () { bump(chip || document.querySelector('.money')); }, 200);
    } else {
      for (var j = 0; j < N_COINS; j++) {
        var coin = document.createElement('div');
        coin.className = 'coin';
        coin.textContent = '$';
        layer.appendChild(coin);
        var sx = tx + (Math.random() * 120 - 60), sy = ty - 170 - Math.random() * 80;
        var ex = tx + (Math.random() * 20 - 10), ey = ty;
        var a = coin.animate([
          { transform: 'translate(' + sx + 'px,' + sy + 'px) rotateY(0deg) scale(1)', opacity: 0, offset: 0 },
          { transform: 'translate(' + (sx + (ex - sx) * 0.15) + 'px,' + (sy + (ey - sy) * 0.15) + 'px) rotateY(180deg) scale(1)', opacity: 1, offset: 0.15 },
          { transform: 'translate(' + ex + 'px,' + ey + 'px) rotateY(720deg) scale(.7)', opacity: 1, offset: 0.9 },
          { transform: 'translate(' + ex + 'px,' + ey + 'px) rotateY(720deg) scale(.3)', opacity: 0, offset: 1 }
        ], { duration: FALL, delay: j * STEP, easing: 'cubic-bezier(.5, 0, .9, .6)', fill: 'both' });
        a.onfinish = (function (el) { return function () { el.remove(); }; })(coin);
      }
      // "+$7.000" que sube desde el valor
      var plus = document.createElement('div');
      plus.className = 'coin-plus';
      plus.textContent = '+' + money(PRICE);
      layer.appendChild(plus);
      var pa = plus.animate([
        { transform: 'translate(' + (tx - 34) + 'px,' + (ty - 14) + 'px)', opacity: 0, offset: 0 },
        { transform: 'translate(' + (tx - 34) + 'px,' + (ty - 30) + 'px)', opacity: 1, offset: 0.2 },
        { transform: 'translate(' + (tx - 34) + 'px,' + (ty - 62) + 'px)', opacity: 0, offset: 1 }
      ], { duration: 900, delay: land[0] * 1000, easing: 'ease-out', fill: 'both' });
      pa.onfinish = function () { plus.remove(); };
      setTimeout(function () { bump(chip || document.querySelector('.money')); }, land[0] * 1000);
      setTimeout(function () { bump(chip || document.querySelector('.money')); }, land[N_COINS - 1] * 1000);
    }

    if (chip) {
      setTimeout(function () {
        var fade = chip.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
        fade.onfinish = function () { chip.remove(); };
      }, land[N_COINS - 1] * 1000 + 1100);
    }

  function isBirthday() { var d = new Date(); return d.getMonth() === 9 && d.getDate() === 27; }

  function bdaySeen() {
    try { return localStorage.getItem(BDAY_KEY + new Date().getFullYear()) === '1'; } catch (e) { return false; }
  }

  function markBdaySeen() {
    try { localStorage.setItem(BDAY_KEY + new Date().getFullYear(), '1'); } catch (e) {}
  }

  function showBirthday() {
    var colors = ['#FF8FB8', '#7C4DB5', '#5CD6E6', '#F5C842', '#B8326F', '#8EE3B0'];
    var pieces = '';
    for (var i = 0; i < 30; i++) {
      pieces += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colors[i % colors.length] +
        ';animation-delay:-' + (Math.random() * 4).toFixed(2) + 's;animation-duration:' + (3.5 + Math.random() * 2.5).toFixed(2) + 's"></i>';
    }
    document.getElementById('bday').innerHTML =
      '<div class="overlay bday-bg" id="bday-bg" role="dialog" aria-modal="true" aria-labelledby="bday-t">' +
      '<div class="confetti" aria-hidden="true">' + pieces + '</div>' +
      '<div class="cele-card">' +
      '<div class="bday-photo"><img src="' + BDAY_PHOTO + '" alt="Foto de los dos"></div>' +
      '<h2 class="cele-title" id="bday-t">¡Feliz cumpleaños, Mi Preciosa!</h2>' +
      '<p class="cele-sub">Que hoy te llenes de amor, alegría y de la bendición de Papito Dios 🎂💜' +
      '<span class="bday-love">Te amo mi oso <span class="e" aria-hidden="true">🐼🦥</span></span></p>' +
      '<button type="button" class="btn primary" data-act="close-bday">¡Gracias, mi amor! 💜</button>' +
      '</div></div>';
  }

  function closeBirthday() {
    markBdaySeen();
    document.getElementById('bday').innerHTML = '';
  }

  function addSlot() {
    if (N >= MAX_N) return;
    state.ticks.push(null);
    N = state.ticks.length;
    celebrate = false;
    hideToast();
    fresh = -1;
    pending = null;
    save();
    render();
  }

  // Quita solo una casilla pendiente (la última que esté sin tachar); las tachadas nunca se borran.
  function removeSlot() {
    if (N <= MIN_N) return;
    var i = state.ticks.lastIndexOf(null);
    if (i < 0) return;
    state.ticks.splice(i, 1);
    N = state.ticks.length;
    fresh = -1;
    celebrate = false;
    hideToast();
    pending = null;
    save();
    render();
  }

  // Flor morada con check y brillitos (mismo morado del tachón)
  function sparkle(cx, cy, r, color) {
    var k = r * 0.28;
    return '<path class="sp" fill="' + color + '" d="M' + cx + ' ' + (cy - r) + ' L' + (cx + k) + ' ' + (cy - k) + ' L' + (cx + r) + ' ' + cy +
      ' L' + (cx + k) + ' ' + (cy + k) + ' L' + cx + ' ' + (cy + r) + ' L' + (cx - k) + ' ' + (cy + k) + ' L' + (cx - r) + ' ' + cy +
      ' L' + (cx - k) + ' ' + (cy - k) + ' Z"/>';
  }

  function stickerSvg() {
    var petals = '';
    for (var a = 0; a < 360; a += 60) {
      petals += '<ellipse cx="50" cy="27" rx="15" ry="24" transform="rotate(' + a + ' 50 50)"/>';
    }
    return '<svg class="sticker" viewBox="-12 -12 124 124" aria-hidden="true">' +
      '<g fill="#4B2A85" stroke="#D9C8F3" stroke-width="2.5">' + petals + '</g>' +
      '<circle cx="50" cy="50" r="19" fill="#fff"/>' +
      '<path d="M41 51 L48 58 L60 43" fill="none" stroke="#4B2A85" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      sparkle(2, 6, 8, '#7C4DB5') + sparkle(100, 10, 6.5, '#A98BE0') + sparkle(98, 94, 6, '#7C4DB5') + sparkle(4, 92, 5.5, '#A98BE0') +
      '</svg>';
  }

  function render() {
    var c = count();
    var all = c === N;
    var head = document.getElementById('head');
    head.className = all ? 'all-done' : '';
    head.innerHTML =
      '<button type="button" class="sound-btn" data-act="toggle-sound" aria-label="' + (soundOn ? 'Silenciar sonidos' : 'Activar sonidos') + '">' + (soundOn ? '🔔' : '🔇') + '</button>' +
      (isBirthday() ? '<button type="button" class="bday-line" data-act="open-bday">🎂 ¡Feliz cumpleaños, Osito! 🎉</button>' : '') +
      '<h1 class="brand">Domis</h1>' +
      '<p class="owner">Angie Acuña</p>' +
      '<p class="day">' + (state.day ? longDate(keyToDate(state.day)) : longDate(new Date())) + '</p>' +
      '<div class="count"><span class="n">' + c + '</span><span class="of">de ' + N + '</span></div>' +
      '<p class="money"><span class="lbl">' + (all ? 'Total del día' : 'Llevas') + '</span><strong>' + money(c * PRICE) + '</strong><span class="max">de ' + money(N * PRICE) + '</span></p>' +
      '<p class="status">' + (all ? '¡Lo lograste, Angie! 💜 Los ' + N + ' domis hechos' : (c === 0 ? 'Toca cada casilla al terminar un domi' : (N - c === 1 ? 'Falta 1' : 'Faltan ' + (N - c)))) + '</p>';

    var html = '';
    for (var i = 0; i < N; i++) {
      var ts = state.ticks[i];
      var done = ts !== null;
      html += '<button type="button" class="tile' + (done ? ' done' : '') + (i === fresh ? ' fresh' : '') + '" data-i="' + i + '"' +
        (done ? ' disabled' : '') +
        ' aria-label="Domi ' + (i + 1) + (done ? ', hecho a las ' + fmtTime(ts) : ', pendiente') + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="meta">' + (done ? '💜 ' + fmtTime(ts) : 'Pendiente') + '</span>' +
        (done ? stickerSvg() : '') +
        '</button>';
    }
    document.getElementById('grid').innerHTML = html;

    document.getElementById('undo').disabled = c === 0;
    document.getElementById('reset').disabled = c === 0;
    document.getElementById('slots').textContent = N;
    document.getElementById('less').disabled = N <= MIN_N || state.ticks.indexOf(null) < 0;
    document.getElementById('more').disabled = N >= MAX_N;

    var conf = document.getElementById('confirm');
    if (pending === 'undo' && c > 0) {
      conf.innerHTML = '<div class="confirm"><p>¿Quitar el tachón del domi ' + (lastIndex() + 1) + '?</p><div class="row">' +
        '<button type="button" class="btn primary" data-act="do-undo">Sí, quitarlo</button>' +
        '<button type="button" class="btn" data-act="cancel">No, dejarlo</button></div></div>';
    } else if (pending === 'reset' && c > 0) {
      conf.innerHTML = '<div class="confirm"><p>¿Borrar los ' + c + ' tachones y empezar de nuevo?</p><div class="row">' +
        '<button type="button" class="btn primary" data-act="do-reset">Sí, borrar todo</button>' +
        '<button type="button" class="btn" data-act="cancel">No, dejarlo</button></div></div>';
    } else {
      conf.innerHTML = '';
    }

    var notes = '';
    if (state.day && c > 0 && state.day !== todayKey()) {
      notes += '<div class="note">Estos tachones son del ' + longDate(keyToDate(state.day)).toLowerCase() + '. ' +
        '<button type="button" data-act="ask-reset">Empezar un día nuevo</button></div>';
    }
    if (!storageOk) {
      notes += '<div class="note warn">Este navegador no está guardando los cambios. No cierres esta página o se perderán los tachones.</div>';
    }
    document.getElementById('notes').innerHTML = notes;

    var cele = document.getElementById('cele');
    if (celebrate && all) {
      cele.innerHTML =
        '<div class="overlay" id="cele-bg" role="dialog" aria-modal="true" aria-labelledby="cele-t">' +
        '<div class="cele-card">' +
        '<div class="cele-face">' + FACE_SVG +
        '<img src="cara.png" alt="" hidden onload="this.hidden=false;this.previousElementSibling.hidden=true">' +
        '</div>' +
        '<h2 class="cele-title" id="cele-t">¡Lo lograste, Angie!</h2>' +
        '<p class="cele-sub">' + N + ' domis hechos 💜<strong class="cele-total">' + money(N * PRICE) + '</strong></p>' +
        '<button type="button" class="btn primary" data-act="close-cele">¡Gracias!</button>' +
        '</div></div>';
    } else {
      cele.innerHTML = '';
    }
  }

  // Prepara el sonido de la caja en cuanto ella toca la pantalla, antes del clic
  document.addEventListener('pointerdown', function () { if (soundOn) loadBuffers(); }, { passive: true });

  document.addEventListener('click', function (e) {
    if (soundOn) loadBuffers();
    var btn = e.target.closest('button');
    if (btn && !btn.classList.contains('tile') && !btn.disabled) {
      var a0 = btn.getAttribute('data-act');
      if (a0 !== 'start-welcome' && a0 !== 'toggle-sound') {
        sfx(btn.id === 'more' ? 'add' : (btn.id === 'less' || a0 === 'do-undo' || a0 === 'do-reset') ? 'remove' : 'tap');
      }
    }
    if (e.target.id === 'bday-bg') { closeBirthday(); return; }
    if (e.target.id === 'cele-bg') { celebrate = false; render(); return; }
    var tile = e.target.closest('.tile');
    if (tile && !tile.disabled) { tick(+tile.getAttribute('data-i')); return; }
    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'do-undo') undoLast();
      else if (a === 'do-reset') resetAll();
      else if (a === 'cancel') { pending = null; render(); }
      else if (a === 'ask-reset') { pending = 'reset'; render(); }
      else if (a === 'close-cele') { celebrate = false; render(); }
      else if (a === 'close-bday') closeBirthday();
      else if (a === 'open-bday') showBirthday();
      else if (a === 'start-welcome') startWelcome();
      else if (a === 'toggle-sound') toggleSound();
      return;
    }
    if (e.target.id === 'undo' && count() > 0) { pending = 'undo'; render(); }
    if (e.target.id === 'reset' && count() > 0) { pending = 'reset'; render(); }
    if (e.target.id === 'more') addSlot();
    if (e.target.id === 'less') removeSlot();
  });

  render();
  if (soundOn) loadBuffers(); // deja listos los sonidos desde que abre la página
  if (!welcomeSeen()) showWelcome();
  else if (isBirthday() && !bdaySeen()) showBirthday();
})();
</script>
</body>
</html>
